<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практика по формам</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <form class="form">
    <div class="fieldset-container">
      <fieldset class="form-group">
        <h3 class="hh">Ваши личные данные</h3>
        <label class="label">
          Ваше имя
          <input class="input" placeholder="Имя" inputmode="name" required>
        </label>
        <label class="label">
          Ваш возраст
          <input class="input" placeholder="Возраст" inputmode="numeric" name="age" required>
        </label>
        <label class="label">
          Ваш номер телефона
          <input class="input" placeholder="Номер телефона" inputmode="tel" name="phone" required>
        </label>
        <label class="label">
          Ваша почта
          <input class="input" placeholder="Почта" inputmode="email" name="email" required>
        </label>
      </fieldset>


      <fieldset>
        <label class="labell">
          Сообщение
          <textarea class="texter" placeholder="Ваше сообщение" inputmode="message" name="message" required></textarea>
        </label>
        <label class="checkbox">
          <input type="checkbox" name="check" value="check">
          Я принимаю правила
        </label>
        <button type="submit" class="button">Отправить</button>
      </fieldset>
    </div>
  </form>

</body>

</html>
